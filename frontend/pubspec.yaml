# pubspec.yaml
# Purpose: Flutter dependency manifest (equivalent to Python's requirements.txt).
# Run `flutter pub get` after editing this file.

name: ai_comm_app
description: AI-first communication POC — conversations become actionable.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client — talks to FastAPI with JWT interceptor
  dio: ^5.7.0

  # State management — reactive UI updates when auth state changes
  flutter_riverpod: ^2.6.1

  # Encrypted storage for JWT tokens on device
  flutter_secure_storage: ^9.2.2

  # Declarative routing between screens
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
